[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "csmodel-hybrid"
version = "0.1.0"
description = "1D CS Hybrid Model for coastal dune–dike simulation (TU Delft)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Copyright (c) 2025, Delft University of Technology. All rights reserved." }
authors = [
    { name = "Filipe Galiforni Silva" },
    { name = "Ad Reniers" },
    { name = "Sierd de Vries" },
    { name = "Floris van Rees" },
    { name = "Caroline Hallin" },
]
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "shapely",
    "pandas",
    "netCDF4",
    "pyyaml",
    "pillow",
    "imageio",
    "imageio-ffmpeg",
]

[tool.setuptools.packages.find]
where = ["src"]
